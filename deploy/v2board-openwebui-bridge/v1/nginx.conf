server {
    listen 80;

    client_max_body_size 0;
    proxy_request_buffering off;
    error_log /dev/stderr debug;


    # location = /174 {
    #     return 302 https://www.baidu.com;
    # }

    # 处理关键路径
    location = /_auth {
        internal;
        resolver 127.0.0.11 ipv6=off;
        proxy_set_header Authorization "Bearer $original_token";

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://host.docker.internal:8080/api/v1/user/info;

    }

    location = /auth {
        # 必须是GET
        limit_except GET {
            deny all;
        }

        # 获取请求头里的tokenl
        set $original_token $arg_token;
        if ($original_token = "") {
            return 400;
        }

        auth_request /_auth;
        # 从认证服务器获取用户信息并设置header
        auth_request_set $user_email $upstream_http_x_open_webui_user_email;
        auth_request_set $user_name $upstream_http_x_open_webui_user_name;
        auth_request_set $user_role $upstream_http_x_open_webui_user_role;

        # 将值都写入到cookie里
        add_header Set-Cookie "user_email=$user_email; Path=/; HttpOnly; SameSite=Strict" always;
        add_header Set-Cookie "user_name=$user_name; Path=/; HttpOnly; SameSite=Strict" always  ;
        add_header Set-Cookie "user_role=$user_role; Path=/; HttpOnly; SameSite=Strict" always;
        add_header Cache-Control no-cache always;


        proxy_pass http://open-webui:8080;
    }

    location = /api/v1/auths/signin {
        limit_except POST {
            deny all;
        }

        # 从cookie里获取用户信息
        set $user_email $cookie_user_email;
        set $user_name $cookie_user_name;
        set $user_role $cookie_user_role;

        proxy_set_header X-Open-Webui-User-Email $user_email;
        proxy_set_header X-Open-Webui-User-Name  $user_name;
        proxy_set_header X-Open-Webui-User-Role  $user_role;

        # 将用户信息传递给 open-webui
        proxy_pass http://open-webui:8080;
    }

      # 所有其他请求
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://open-webui:8080;
    }

    # 错误处理
    error_page 400 = @error400;
    error_page 401 = @error401;
    error_page 403 = @error403;
    error_page 500 502 503 504 = @error5xx;

    location @error400 {
        add_header Content-Type application/json always;
        return 400 '{"error": "Bad Request", "message": "Invalid request"}';
    }

    location @error401 {
        add_header Content-Type application/json always;
        return 401 '{"error": "Unauthorized", "message": "Please login to access this resource"}';
    }

    location @error403 {
        add_header Content-Type application/json always;
        return 403 '{"error": "Forbidden", "message": "No permission to access this resource"}';
    }

    location @error5xx {
        internal;
        add_header Content-Type application/json always;

        # 只使用 Nginx 内置的可用变量
        return 500 '{"error": "Internal Server Error",
                    "status": $status,
                    "upstream_status": "$upstream_status",
                    "upstream_addr": "$upstream_addr",
                    "request_uri": "$request_uri"}';
    }
}